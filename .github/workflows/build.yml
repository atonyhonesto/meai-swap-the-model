name: build-and-test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MeaiSwapTheModel.slnx

      - name: Build
        run: dotnet build MeaiSwapTheModel.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MeaiSwapTheModel.slnx --no-build --configuration Release --verbosity normal
